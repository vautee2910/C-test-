# HGB concept knowledge base — SHARED across all German annual statements.
#
# This is NOT per company. It maps canonical concept keys to the German line-item
# labels (synonyms) that appear in HGB balance sheets (§266) and income
# statements (§275, Gesamtkostenverfahren). Kanzleien word items slightly
# differently, so the matcher folds umlauts, strips enumerators (I., 1., a)) and
# falls back to fuzzy matching — add synonyms here as new variants are seen.
#
# section: aktiva | passiva | guv   (free-text, carried onto the Fact)

