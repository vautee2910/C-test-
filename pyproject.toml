[project]
name = "fsx"
version = "0.1.0"
description = "On-premise financial-statement extraction & anonymisation pipeline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Run from the repo root without an install; src/ holds the package.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
